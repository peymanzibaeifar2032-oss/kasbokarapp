plugins {
    id "com.android.application"
}

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "com.peymanzibaeifar.tattoobooking"
    compileSdk 34

    defaultConfig {
        applicationId "com.peymanzibaeifar.tattoobooking"
        minSdk 26
        targetSdk 34
        testInstrumentationRunner "com.peymanzibaeifar.tattoobooking.PocketSyncTest"
        versionCode 24
        versionName "1.15.2"
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile rootProject.file(keystoreProperties["storeFile"])
                storePassword keystoreProperties["storePassword"]
                keyAlias keystoreProperties["keyAlias"]
                keyPassword keystoreProperties["keyPassword"]
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".test"
            versionNameSuffix "-test"
            resValue "string", "app_name", "تقویم نوبت TEST"
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}


dependencies {
    implementation "androidx.webkit:webkit:1.11.0"
}
