services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: kasbokar
      POSTGRES_USER: kasbokar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-now}
    volumes:
      - kasbokar_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kasbokar"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      STANDALONE: "true"
      NODE_ENV: production
      NITRO_PRESET: node-server
      PORT: "8080"
      SITE_URL: ${SITE_URL:-https://kasbokarapp.com}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-https://kasbokarapp.com}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
      DATABASE_URL: postgres://kasbokar:${POSTGRES_PASSWORD:-change-me-now}@db:5432/kasbokar
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}

volumes:
  kasbokar_pg:
