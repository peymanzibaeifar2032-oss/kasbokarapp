<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>تاتوهاب</title>
<style>
:root { --bg:#f6f1ea; --ink:#1c2430; --muted:#667085; --line:#eadfd2; --coral:#ff5a36; }
* { box-sizing:border-box; }
html, body { margin:0; background:var(--bg); color:var(--ink); font-family:Vazirmatn,"Noto Naskh Arabic",Tahoma,sans-serif; }
button, input, textarea, select { font:inherit; color:inherit; }
button { cursor:pointer; }
.stripe { height:7px; background:linear-gradient(90deg,#ff5a36,#f5b942,#14b8a6,#3b6cff,#7c5cff); }
.top { position:sticky; top:0; z-index:5; background:rgba(246,241,234,.94); }
.bar { display:flex; align-items:center; justify-content:space-between; padding:10px 14px; }
.brand { display:flex; align-items:center; gap:8px; font-weight:900; font-size:22px; }
.mark { width:36px; height:36px; border-radius:12px; display:grid; place-items:center; color:#fff; background:linear-gradient(135deg,#ff5a36,#ff8a3d); }
.main { padding:8px 14px 118px; }
.card { background:#fff; border-radius:22px; box-shadow:0 10px 30px rgba(70,42,20,.08); overflow:hidden; margin-bottom:14px; }
.pad { padding:14px; }
.row { display:flex; align-items:center; gap:10px; }
.grow { flex:1; min-width:0; }
.muted { color:var(--muted); font-size:12px; line-height:1.7; }
.name { font-weight:800; }
.avatar { width:48px; height:48px; border-radius:50%; display:grid; place-items:center; color:#fff; font-weight:900; background:#ff5a36; object-fit:cover; flex:none; }
.photo { width:100%; max-height:440px; object-fit:cover; display:block; background:#efe7dc; }
.compare { display:grid; grid-template-columns:1fr 1fr 1fr; gap:4px; background:#efe7dc; }
.compare figure { margin:0; }
.compare img { width:100%; height:140px; object-fit:cover; display:block; }
.compare figcaption { text-align:center; font-size:11px; font-weight:800; padding:6px 2px; background:#fff; }
.actions { display:flex; gap:8px; padding:8px 12px 0; }
.act, .chip { border:0; border-radius:999px; background:#f6f1ea; padding:10px 12px; font-weight:800; }
.act.on, .chip.on { background:#1c2430; color:#fff; }
.caption { padding:8px 14px 12px; line-height:1.8; }
.tags { display:flex; flex-wrap:wrap; gap:6px; padding:0 14px 14px; }
.tag { background:#eef3ff; color:#27408f; border-radius:999px; padding:4px 8px; font-size:11px; font-weight:800; }
.nav { position:fixed; left:12px; right:12px; bottom:12px; background:#fff; border-radius:24px; display:grid; grid-template-columns:repeat(5,1fr); padding:6px; z-index:6; box-shadow:0 12px 40px rgba(40,24,10,.16); }
.nav button { border:0; background:transparent; border-radius:18px; padding:8px 0; font-size:11px; font-weight:800; color:var(--muted); }
.nav button.on { background:#fff1ec; color:var(--coral); }
.plus { width:48px; height:48px; border:0; border-radius:16px; color:#fff; background:linear-gradient(135deg,#ff5a36,#7c5cff); font-size:30px; margin:-20px auto 0; display:grid; place-items:center; }
.field { display:grid; gap:6px; margin:10px 0; font-size:13px; font-weight:800; }
.field input, .field textarea, .field select { width:100%; border:1px solid var(--line); border-radius:14px; padding:12px; background:#fff; }
.field textarea { min-height:96px; }
.primary { width:100%; min-height:54px; border:0; border-radius:16px; color:#fff; font-size:18px; font-weight:900; background:linear-gradient(135deg,#ff5a36,#ff8a3d); }
.pick { display:block; text-align:center; background:#eef3ff; color:#27408f; border-radius:16px; padding:16px; font-weight:900; }
.preview { width:100%; border-radius:16px; margin-top:8px; max-height:280px; object-fit:cover; }
.note { background:#fff7ed; color:#9a3412; border-radius:16px; padding:12px; line-height:1.7; }
.toast { position:fixed; top:16px; left:16px; right:16px; background:#1c2430; color:#fff; border-radius:16px; padding:12px; z-index:9; text-align:center; font-weight:800; }
.stories { display:flex; gap:10px; overflow:auto; padding-bottom:10px; }
.story { width:72px; border:0; background:none; text-align:center; }
.story b { display:block; font-size:11px; margin-top:4px; }
.ring { padding:3px; border-radius:50%; background:linear-gradient(135deg,#ff5a36,#7c5cff); }
.h1 { font-size:26px; margin:6px 0; }
.chat { display:flex; flex-direction:column; height:calc(100dvh - 168px); }
.log { flex:1; overflow:auto; padding-bottom:8px; }
.bubble { max-width:78%; padding:10px 12px; border-radius:18px; margin:6px 0; line-height:1.7; }
.mine { margin-inline-start:auto; background:#ffe1d8; }
.theirs { margin-inline-end:auto; background:#fff; }
.composer { display:flex; gap:8px; }
.composer input { flex:1; border:1px solid var(--line); border-radius:16px; padding:12px; }
.composer button { border:0; border-radius:16px; background:#ff5a36; color:#fff; font-weight:900; padding:0 16px; }
.msg { width:100%; display:flex; gap:10px; align-items:center; text-align:right; border:0; background:#fff; border-radius:18px; padding:12px; margin-bottom:8px; }
.grid3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; }
</style>
</head>
<body>
<div class="stripe"></div>
<div class="top"><div class="bar"><div class="brand"><div class="mark">ت</div>تاتوهاب</div><button id="search-btn" style="border:0;background:#fff;border-radius:14px;width:40px;height:40px">جستجو</button></div></div>
<div id="app" class="main"></div>
<nav class="nav">
  <button data-go="feed">خانه</button>
  <button data-go="explore">اکسپلور</button>
  <button data-go="create" aria-label="پست جدید"><span class="plus">+</span></button>
  <button data-go="inbox">پیام</button>
  <button data-go="profile">من</button>
</nav>
<div id="toast" class="toast" hidden></div>
<script>
const VERSION = "1.0.1";
const API = location.hostname.endsWith("kasbokarapp.com") ? "" : "https://kasbokarapp.com";
const INKS = ["Eternal","Intenze","World Famous","Kuro Sumi","Solid Ink","Dynamic","Starbrite","Fusion"];
const NEEDLES = ["Cheyenne","Kwadron","Elite","Da Vinci","Emalla","Bishop"];
const TYPES = ["RL","RS","RM","M1","Magnum","CM"];
const MACHINES = ["Cheyenne","FK Irons","Bishop","Mast","Critical","Dragonhawk"];
const STYLES = ["رئال","فاین‌لاین","سنتی","بلک‌ورک","تریبال","حروف","مینی‌مال","ژاپنی"];
const state = { screen:"feed", data:null, postId:"", withId:"", q:"", filter:"همه", mode:"post", draft:{}, timer:0 };
function esc(value){return String(value ?? "").replace(/[&<>"]/g,(ch)=>({"&":"\u0026amp;","<":"\u0026lt;",">":"\u0026gt;",'"':"\u0026quot;"}[ch]));}
function toast(text){const el=document.getElementById("toast"); el.hidden=false; el.textContent=text; setTimeout(()=>{el.hidden=true;},2200);}
function token(){try{return localStorage.getItem("hub-token")||"";}catch(e){return "";}}
async function api(body){
  const headers={"Content-Type":"application/json"};
  if(token()) headers.Authorization="Bearer "+token();
  const res=await fetch(API+"/api/tattoohub",{method:"POST",headers,credentials:"include",body:JSON.stringify(body)});
  const data=await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.error||"انجام نشد.");
  return data;
}
function me(){return state.data && state.data.me;}
function people(){return (state.data && state.data.people) || [];}
function person(id){return people().find((item)=>item.user_id===id) || {name:"آرتیست", avatar:"", city:""};}
function face(item, cls){
  if(item && item.avatar) return `<img class="${cls||"avatar"}" alt="" src="${item.avatar}" />`;
  return `<div class="${cls||"avatar"}">${esc((item && item.name || "؟").slice(0,1))}</div>`;
}
function ago(value){
  const time=new Date(value).getTime();
  const mins=Math.max(1,Math.round((Date.now()-time)/60000));
  if(mins<60) return mins+" دقیقه پیش";
  const hours=Math.round(mins/60);
  if(hours<24) return hours+" ساعت پیش";
  return Math.round(hours/24)+" روز پیش";
}
function srcOf(value){return value && String(value).startsWith("data:image/") ? value : "";}
function photo(value, label){
  const src=srcOf(value);
  return src ? `<img class="photo" alt="${esc(label||"")}" src="${src}" />` : `<div class="photo" style="display:grid;place-items:center;height:140px">${esc(label||"بدون عکس")}</div>`;
}
function card(item){
  const author=person(item.user_id);
  const compare=item.compare && typeof item.compare==="object" ? item.compare : null;
  const visual=compare ? `<div class="compare">${[["sketch","طرح اولیه"],["fresh","کار تازه"],["healed","بعد از هیلد"]].map(([key,label])=>`<figure>${photo(compare[key],label)}<figcaption>${label}</figcaption></figure>`).join("")}</div>` : photo(item.image, item.style);
  const tags=[item.style,item.technique,item.ink,item.needle,item.needle_type,item.machine].filter(Boolean);
  return `<article class="card" data-post="${esc(item.id)}"><div class="pad row" data-user="${esc(item.user_id)}">${face(author)}<div><div class="name">${esc(item.name||author.name)}</div><div class="muted">${esc(item.city||author.city||"")} · ${ago(item.created_at)}</div></div></div>${visual}<div class="actions"><button class="act ${item.liked?"on":""}" data-like="${esc(item.id)}">پسند ${item.likes||0}</button><button class="act" data-post="${esc(item.id)}">گفتگو ${(item.comments||[]).length}</button><button class="act" data-save="${esc(item.id)}">ذخیره</button></div><div class="caption">${esc(item.caption)}</div><div class="tags">${tags.map((tag)=>`<span class="tag">${esc(tag)}</span>`).join("")}</div></article>`;
}
function posts(){return (state.data && state.data.posts) || [];}
function render(){
  const root=document.getElementById("app");
  const screen=state.screen;
  document.querySelectorAll(".nav button").forEach((button)=>{button.classList.toggle("on", button.dataset.go===screen);});
  if(!state.data){root.innerHTML=`<div class="card pad">در حال دریافت فید...</div>`; return;}
  if(screen==="feed") root.innerHTML=feedView();
  else if(screen==="explore") root.innerHTML=exploreView();
  else if(screen==="create") root.innerHTML=createView();
  else if(screen==="post") root.innerHTML=postView();
  else if(screen==="inbox") root.innerHTML=inboxView();
  else if(screen==="thread") root.innerHTML=threadView();
  else if(screen==="profile"||screen==="user") root.innerHTML=profileView(screen==="profile");
  else if(screen==="edit") root.innerHTML=editView();
  else if(screen==="search") root.innerHTML=searchView();
  else if(screen==="about") root.innerHTML=aboutView();
  else if(screen==="story") root.innerHTML=storyView();
  bind();
}
function feedView(){
  const stories=(state.data.stories||[]);
  const seen=[];
  const row=stories.filter((item)=>{if(seen.includes(item.user_id)) return false; seen.push(item.user_id); return true;});
  const gate=me()?"":`<div class="note">فید برای مهمان باز است. برای پست، استوری و پیام با گوگل وارد شو.</div><button class="primary" id="login" type="button">ورود با گوگل</button><div style="height:12px"></div>`;
  return `${gate}<div class="stories">${row.map((item)=>`<button class="story" data-story="${esc(item.id)}"><div class="ring">${face(item)}</div><b>${esc(String(item.name||"").split(" ")[0])}</b></button>`).join("")}</div>${posts().map(card).join("")||`<div class="card pad">هنوز پستی نیست. دکمه نارنجی را بزن و اولین عکس را منتشر کن.</div>`}`;
}
function exploreView(){
  const filters=["همه",...STYLES];
  const list=posts().filter((item)=>state.filter==="همه"||item.style===state.filter||item.ink===state.filter||item.needle_type===state.filter);
  return `<div style="display:flex;gap:8px;overflow:auto;padding-bottom:8px">${filters.map((item)=>`<button class="chip ${state.filter===item?"on":""}" data-filter="${esc(item)}">${esc(item)}</button>`).join("")}</div>${list.map(card).join("")||`<div class="card pad">با این فیلتر پستی نیست.</div>`}`;
}
function createView(){
  const mode=state.mode;
  const options=(list)=>`<option value="">نمی‌نویسم</option>${list.map((item)=>`<option>${item}</option>`).join("")}`;
  const tools=mode==="story"?"":`<label class="field">سبک<select name="style">${options(STYLES)}</select></label><label class="field">برند رنگ<select name="ink">${options(INKS)}</select></label><label class="field">برند سوزن<select name="needle">${options(NEEDLES)}</select></label><label class="field">نوع سوزن<select name="type">${options(TYPES)}</select></label><label class="field">دستگاه<select name="machine">${options(MACHINES)}</select></label>`;
  const files=mode==="compare"?`<div class="grid3"><label class="pick">طرح اولیه<input name="sketch" type="file" accept="image/*" hidden></label><label class="pick">کار تازه<input name="fresh" type="file" accept="image/*" hidden></label><label class="pick">بعد از هیلد<input name="healed" type="file" accept="image/*" hidden></label></div><div class="grid3" id="compare-preview"></div>`:`<label class="pick">انتخاب عکس از گالری<input id="gallery" name="file" type="file" accept="image/*" hidden></label><img id="preview" class="preview" alt="پیش‌نمایش" hidden>`;
  return `<div class="grid3"><button class="chip ${mode==="post"?"on":""}" data-mode="post" type="button">پست</button><button class="chip ${mode==="compare"?"on":""}" data-mode="compare" type="button">قبل / تازه / هیلد</button><button class="chip ${mode==="story"?"on":""}" data-mode="story" type="button">استوری</button></div><form id="create-form" class="card pad"><label class="field">توضیح<textarea name="caption" required placeholder="چه چیزی را امتحان کردی؟"></textarea></label>${files}${tools}<button class="primary" type="submit">${mode==="story"?"گذاشتن استوری":"انتشار پست"}</button></form>`;
}
function postView(){
  const item=posts().find((row)=>row.id===state.postId);
  if(!item) return `<div class="card pad">این پست نیست.</div>`;
  return `${card(item)}<form id="comment-form" class="card pad"><div class="name">گفتگو</div>${(item.comments||[]).map((comment)=>`<div style="padding:8px 0;border-top:1px solid #eadfd2"><b>${esc(comment.name)}</b><div>${esc(comment.text)}</div></div>`).join("")}<label class="field">نظر تو<input name="text" required></label><button class="primary" type="submit">ثبت نظر</button></form>`;
}
function inboxView(){
  if(!me()) return `<div class="card pad"><p>پیام خصوصی بعد از ورود باز می‌شود.</p><button class="primary" id="login" type="button">ورود با گوگل</button></div>`;
  return people().filter((item)=>item.user_id!==me().user_id).map((item)=>`<button class="msg" data-chat="${esc(item.user_id)}">${face(item)}<span class="grow"><b>${esc(item.name)}</b><span class="muted" style="display:block">${esc(item.city||"گفتگو")}</span></span></button>`).join("")||`<div class="card pad">هنوز هنرجو یا آرتیست دیگری وارد نشده.</div>`;
}
function threadView(){
  const other=person(state.withId);
  const rows=state.thread||[];
  return `<div class="chat"><div class="row">${face(other)}<div><div class="name">${esc(other.name)}</div><div class="muted">گفتگوی دو نفره</div></div></div><div class="log" id="log">${rows.map((item)=>`<div class="bubble ${item.from_id===me().user_id?"mine":"theirs"}">${esc(item.body)}</div>`).join("")}</div><form id="message-form" class="composer"><input name="text" placeholder="بنویس..." required><button>بفرست</button></form></div>`;
}
function profileView(self){
  const item=self?me():person(state.withId);
  if(!item) return `<div class="card pad"><div class="h1">هنوز وارد نشدی</div><button class="primary" id="login" type="button">ورود با گوگل</button></div>`;
  const list=posts().filter((post)=>post.user_id===(item.user_id));
  const styles = Array.isArray(item.styles) ? item.styles : [];
  return `<div class="card pad">${face(item)}<div class="h1">${esc(item.name)}</div><div class="muted">${esc(item.city||"")}</div><p>${esc(item.bio||"")}</p><div class="tags">${styles.map((style)=>`<span class="tag">${esc(style)}</span>`).join("")}</div>${self?`<button class="primary" data-go="edit" type="button">تغییر عکس و مشخصات</button><button class="chip" data-go="about" type="button" style="margin-top:8px">درباره</button>`:""}</div><div class="name">پست‌ها</div>${list.map(card).join("")||`<div class="card pad">هنوز پستی از این حساب در فید نیست.</div>`}`;
}
function editView(){
  const item=me();
  if(!item) return profileView(true);
  return `<form id="profile-form" class="card pad">${face(item)}<label class="pick">انتخاب عکس پروفایل از گالری<input id="avatar-file" type="file" accept="image/*" hidden></label><img id="avatar-preview" class="preview" alt="" ${item.avatar?`src="${item.avatar}"`:"hidden"}><label class="field">نام<input name="name" value="${esc(item.name)}" required></label><label class="field">شهر<input name="city" value="${esc(item.city||"")}"></label><label class="field">بیو<textarea name="bio">${esc(item.bio||"")}</textarea></label><button class="primary">ذخیره پروفایل</button></form>`;
}
function searchView(){
  const q=state.q.trim();
  const foundPosts=!q?[]:posts().filter((item)=>`${item.caption} ${item.style} ${item.ink} ${item.needle} ${item.needle_type} ${item.name}`.includes(q));
  const foundPeople=!q?[]:people().filter((item)=>`${item.name} ${item.city}`.includes(q));
  return `<label class="field">جستجو<input id="q" value="${esc(state.q)}" placeholder="نام، شهر یا برند"></label>${foundPeople.map((item)=>`<button class="msg" data-user="${esc(item.user_id)}">${face(item)}<b>${esc(item.name)}</b></button>`).join("")}${foundPosts.map(card).join("")}`;
}
function storyView(){
  const item=state.storyItem;
  if(!item) return `<div class="card pad">این استوری تمام شده.</div>`;
  return `<button class="card" data-go="feed" style="border:0;padding:0;width:100%;text-align:right">${item.image?`<img class="photo" alt="" src="${item.image}">`:""}<div class="pad">${face(item)} <b>${esc(item.name||"")}</b><p>${esc(item.body||"")}</p><div class="muted">تا ۲۴ ساعت می‌ماند</div></div></button>`;
}
function aboutView(){return `<div class="card pad"><div class="h1">درباره تاتوهاب</div><p>فضای تبادل تجربه تاتوآرتیست‌ها.</p><p><b>سازنده:</b> پیمان زیبائی‌فر</p><p><b>نسخه:</b> ${VERSION}</p></div>`;}
function bind(){
  document.querySelectorAll("[data-go]").forEach((node)=>node.onclick=()=>{state.screen=node.dataset.go; render();});
  document.querySelectorAll("[data-post]").forEach((node)=>node.onclick=(event)=>{event.stopPropagation(); state.postId=node.dataset.post; state.screen="post"; render();});
  document.querySelectorAll("[data-user]").forEach((node)=>node.onclick=(event)=>{event.stopPropagation(); state.withId=node.dataset.user; state.screen="user"; render();});
  document.querySelectorAll("[data-like]").forEach((node)=>node.onclick=(event)=>{event.stopPropagation(); act(()=>api({action:"like",postId:node.dataset.like}));});
  document.querySelectorAll("[data-save]").forEach((node)=>node.onclick=(event)=>{event.stopPropagation(); const name=prompt("نام کلکسیون، مثلاً سوزن‌های خوب"); if(name) act(()=>api({action:"save",name,postId:node.dataset.save}));});
  document.querySelectorAll("[data-chat]").forEach((node)=>node.onclick=()=>openThread(node.dataset.chat));
  document.querySelectorAll("[data-filter]").forEach((node)=>node.onclick=()=>{state.filter=node.dataset.filter; render();});
  document.querySelectorAll("[data-mode]").forEach((node)=>node.onclick=()=>{state.mode=node.dataset.mode; render();});
  document.querySelectorAll("[data-story]").forEach((node)=>node.onclick=()=>{const item=(state.data.stories||[]).find((row)=>row.id===node.dataset.story); if(item){state.storyItem=item; state.screen="story"; render();}});
  const login=document.getElementById("login");
  if(login) login.onclick=startLogin;
  const create=document.getElementById("create-form");
  if(create){
    create.onsubmit=submitCreate;
    create.querySelectorAll('input[type="file"]').forEach((input)=>input.onchange=()=>previewFile(input));
  }
  const comment=document.getElementById("comment-form");
  if(comment) comment.onsubmit=async(event)=>{event.preventDefault(); const text=new FormData(event.target).get("text"); await act(()=>api({action:"comment",postId:state.postId,text}));};
  const message=document.getElementById("message-form");
  if(message) message.onsubmit=async(event)=>{event.preventDefault(); const text=new FormData(event.target).get("text"); event.target.reset(); const data=await api({action:"send",to:state.withId,text}); state.thread=data.messages||[]; render();};
  const profile=document.getElementById("profile-form");
  if(profile){profile.onsubmit=submitProfile; const file=document.getElementById("avatar-file"); if(file) file.onchange=()=>previewFile(file,"avatar-preview");}
  const q=document.getElementById("q");
  if(q) q.oninput=()=>{state.q=q.value; const focus=q.selectionStart; render(); const next=document.getElementById("q"); if(next){next.focus(); next.selectionStart=focus;}};
  const log=document.getElementById("log");
  if(log) log.scrollTop=log.scrollHeight;
}
async function previewFile(input, imageId){
  const file=input.files && input.files[0];
  if(!file) return;
  const data=await compress(file);
  input.dataset.image=data;
  const image=document.getElementById(imageId||"preview");
  if(!image && input.name){
    const box=document.getElementById("compare-preview");
    if(box){let img=box.querySelector(`[data-for="${input.name}"]`); if(!img){img=document.createElement("img"); img.className="preview"; img.dataset.for=input.name; box.appendChild(img);} img.src=data;}
    return;
  }
  if(image){image.hidden=false; image.src=data;}
}
function compress(file){
  return new Promise((resolve,reject)=>{
    const image=new Image();
    const url=URL.createObjectURL(file);
    image.onload=()=>{
      const scale=Math.min(1,800/Math.max(image.width,image.height));
      const canvas=document.createElement("canvas");
      canvas.width=Math.max(1,Math.round(image.width*scale));
      canvas.height=Math.max(1,Math.round(image.height*scale));
      canvas.getContext("2d").drawImage(image,0,0,canvas.width,canvas.height);
      URL.revokeObjectURL(url);
      resolve(canvas.toDataURL("image/jpeg",0.68));
    };
    image.onerror=()=>reject(new Error("این عکس باز نشد."));
    image.src=url;
  });
}
async function submitCreate(event){
  event.preventDefault();
  if(!me()) return startLogin();
  const form=event.target;
  const data=new FormData(form);
  const caption=String(data.get("caption")||"").trim();
  const button=form.querySelector("button[type=submit]");
  button.disabled=true;
  try{
    if(state.mode==="story"){
      const file=form.querySelector('input[name="file"]');
      await api({action:"story",text:caption,image:file && file.dataset.image || ""});
      toast("استوری گذاشته شد");
    } else if(state.mode==="compare"){
      const read=(name)=>form.querySelector(`[name="${name}"]`)?.dataset.image||"";
      await api({action:"post",caption,style:data.get("style"),ink:data.get("ink"),needle:data.get("needle"),type:data.get("type"),machine:data.get("machine"),compare:{sketch:read("sketch"),fresh:read("fresh"),healed:read("healed")}});
      toast("پست برای همه منتشر شد");
    } else {
      const file=form.querySelector("#gallery");
      await api({action:"post",caption,image:file && file.dataset.image || "",style:data.get("style"),ink:data.get("ink"),needle:data.get("needle"),type:data.get("type"),machine:data.get("machine")});
      toast("پست برای همه منتشر شد");
    }
    state.screen="feed";
    await refresh();
  }catch(err){toast(err.message); button.disabled=false;}
}
async function submitProfile(event){
  event.preventDefault();
  const form=event.target;
  const data=new FormData(form);
  const file=document.getElementById("avatar-file");
  await act(async()=>{await api({action:"profile",name:data.get("name"),city:data.get("city"),bio:data.get("bio"),avatar:file && file.dataset.image || me().avatar || ""}); state.screen="profile";});
}
async function openThread(id){
  if(!me()) return startLogin();
  state.withId=id;
  state.screen="thread";
  const data=await api({action:"thread",withId:id});
  state.thread=data.messages||[];
  render();
  clearInterval(state.timer);
  state.timer=setInterval(async()=>{
    if(state.screen!=="thread") return clearInterval(state.timer);
    const next=await api({action:"thread",withId:state.withId}).catch(()=>null);
    if(next){state.thread=next.messages||[]; const log=document.getElementById("log"); if(log){const atBottom=log.scrollTop+log.clientHeight>log.scrollHeight-40; log.innerHTML=state.thread.map((item)=>`<div class="bubble ${item.from_id===me().user_id?"mine":"theirs"}">${esc(item.body)}</div>`).join(""); if(atBottom) log.scrollTop=log.scrollHeight;}}
  },3000);
}
function startLogin(){
  if(window.AndroidHub && AndroidHub.googleLogin){AndroidHub.googleLogin(); return;}
  location.href="/login?next=/tattoohub/";
}
async function act(work){
  try{await work(); await refresh();}catch(err){toast(err.message||"انجام نشد.");}
}
async function refresh(){
  try{state.data=await api({action:"feed"});}catch(err){if(!state.data) document.getElementById("app").innerHTML=`<div class="card pad">${esc(err.message)}</div>`;}
  if(state.screen!=="thread") render();
}
window.hubSignedIn=async function(value){localStorage.setItem("hub-token",value); await refresh();};
document.getElementById("search-btn").onclick=()=>{state.screen="search"; render();};
if(window.AndroidHub && AndroidHub.token && AndroidHub.token()) localStorage.setItem("hub-token", AndroidHub.token());
refresh();
</script>
