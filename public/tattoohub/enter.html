<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ورود تاتوهاب</title>
</head>
<body style="font-family:Tahoma,sans-serif;background:#fff;color:#111;padding:24px;line-height:1.8">
<p id="status">در حال اتصال حساب گوگل به تاتوهاب...</p>
<p><a id="open" hidden style="display:inline-block;background:#111;color:#fff;text-decoration:none;border-radius:12px;padding:12px 18px">بازگشت به تاتوهاب</a></p>
<script>
async function go() {
  const res = await fetch("/api/tattoohub", {
    method: "POST",
    credentials: "include",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ action: "mint" }),
  });
  if (res.status === 401) {
    location.replace("/login?next=/tattoohub/enter.html");
    return;
  }
  const data = await res.json().catch(() => ({}));
  if (!data.token) {
    document.getElementById("status").textContent = data.error || "ورود انجام نشد.";
    return;
  }
  const openUrl = "tattoohub://auth?token=" + encodeURIComponent(data.token);
  const link = document.getElementById("open");
  link.href = openUrl;
  link.hidden = false;
  document.getElementById("status").textContent = "اگر اپ خودش باز نشد، دکمه را بزن.";
  location.href = openUrl;
}
go();
</script>
</body>
</html>
