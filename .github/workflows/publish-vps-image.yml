name: publish-vps-image

# Builds the production image on GitHub (npm works there) and pushes to GHCR
# so the Iranian VPS can pull instead of running npm. DNS is not changed.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "package.json"
      - "package-lock.json"
      - "src/**"
      - "server/**"
      - "migrations/**"
      - "scripts/**"
      - "public/**"
      - ".github/workflows/publish-vps-image.yml"

env:
  IMAGE: ghcr.io/peymanzibaeifar2032-oss/kasbokarapp

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:prod
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
