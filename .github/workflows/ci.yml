name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: node --experimental-strip-types --test src/lib/guide/guide.test.ts src/lib/map/tiles.test.ts src/lib/server/visibility.test.ts
      - run: npm run build
        env:
          NODE_ENV: production
