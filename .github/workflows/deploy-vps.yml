name: deploy-vps

# GitHub main is source of truth. CI must pass first.
# VPS also polls main every 2 minutes (kasbokar-watch.timer) because
# GitHub-hosted runners often cannot SSH into Iranian IPs.
# Secrets never logged. DNS is not changed.

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check VPS secrets
        id: check
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          if [ -z "$VPS_HOST" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "VPS_HOST unset — GitHub did not SSH. This is not a Production release."
            echo "::warning::VPS_HOST secret is unset. kasbokar-watch.timer must apply origin/main."
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "::error::Manual deploy-vps requires VPS_HOST, VPS_USER, and VPS_SSH_KEY."
              exit 1
            fi
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify production release when SSH deploy is unavailable
        if: steps.check.outputs.skip == 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -eu
          LAST_ERR=""
          i=0
          while [ "$i" -lt 7 ]; do
            i=$((i + 1))
            if LAST_ERR=$(node scripts/check-production-health.mjs \
              https://kasbokarapp.com/api/health \
              --event-name "$EVENT_NAME" \
              --workflow-run-head-sha "${WORKFLOW_RUN_HEAD_SHA:-}" \
              --current-sha "${CURRENT_SHA:-}" 2>&1)
            then
              echo "Production already serves the expected release; VPS timer path is healthy."
              exit 0
            fi
            sleep 20
          done
          echo "::error::GitHub could not SSH to the VPS and kasbokarapp.com is not serving the expected release."
          if [ -n "$LAST_ERR" ]; then
            echo "::error::$LAST_ERR"
          fi
          echo "::error::Set VPS_HOST/VPS_USER/VPS_SSH_KEY, or restore kasbokar-watch.timer plus DNS/TLS/environment on the server."
          exit 1
      - name: Deploy over SSH
        if: steps.check.outputs.skip != 'true'
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script_stop: true
          command_timeout: 30m
          script: |
            set -eu
            APP_DIR="${{ secrets.VPS_APP_DIR }}"
            if [ -z "$APP_DIR" ]; then APP_DIR=/opt/kasbokarapp; fi
            export APP_DIR
            cd "$APP_DIR"
            sh deploy/release.sh
