name: deploy-vps

# GitHub main is source of truth. When VPS secrets exist, each push to main
# pulls and rebuilds on the server. Without secrets the job no-ops so Netlify
# backup and CI are unaffected. DNS is not changed here.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check VPS secrets
        id: check
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          if [ -z "$VPS_HOST" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "VPS_HOST is not set — skip (configure after the server exists)."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy over SSH
        if: steps.check.outputs.skip != 'true'
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            set -eu
            APP_DIR="${{ secrets.VPS_APP_DIR }}"
            if [ -z "$APP_DIR" ]; then APP_DIR=/opt/kasbokarapp; fi
            export APP_DIR
            cd "$APP_DIR"
            export GIT_SSH_COMMAND='ssh -i /root/.ssh/github_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new'
            sh deploy/update.sh
            docker compose --profile with-db --profile tls ps
