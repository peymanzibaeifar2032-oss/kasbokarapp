plugins {
    id "com.android.application"
}

android {
    namespace "com.peymanzibaeifar.tattoohub"
    compileSdk 34

    defaultConfig {
        applicationId "com.peymanzibaeifar.tattoohub"
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName "1.1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
