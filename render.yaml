# Render Blueprint — independent hosting + Postgres (no Grok runtime).
# After GitHub is ready: New → Blueprint → this repo.
databases:
  - name: kasbokar-db
    plan: basic-256mb
    databaseName: kasbokar
    user: kasbokar

services:
  - type: web
    name: kasbokar
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: STANDALONE
        value: "true"
      - key: NODE_ENV
        value: production
      - key: NITRO_PRESET
        value: node-server
      - key: SITE_URL
        value: https://kasbokarapp.com
      - key: BETTER_AUTH_URL
        value: https://kasbokarapp.com
      - key: DATABASE_URL
        fromDatabase:
          name: kasbokar-db
          property: connectionString
      - key: BETTER_AUTH_SECRET
        generateValue: true
