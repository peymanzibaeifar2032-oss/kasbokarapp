<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:720px;font-family:Vazirmatn,sans-serif;direction:rtl;background:#fff;color:#1c3d52}
.wrap{padding:32px 30px 28px}
.hd{display:flex;align-items:center;gap:16px}
.badge{flex:none;width:58px;height:58px;border-radius:29px;background:#e84393;color:#fff;font-weight:900;font-size:28px;display:grid;place-items:center}
h1{font-size:36px;font-weight:900;line-height:1.3}
.sub{font-size:24px;color:#6b7785;margin-top:6px;line-height:1.5}
.grid{display:grid;gap:14px;margin-top:22px}
.card{border-radius:22px;padding:16px 20px;border:3px solid #e6e1d8;background:#fff}
.card h3{font-size:28px;font-weight:900;line-height:1.35}
.card p,.card li{font-size:24px;line-height:1.6}
.card ul{padding-right:26px;margin-top:6px}
.tag{display:inline-block;border-radius:999px;padding:2px 16px;font-size:24px;font-weight:800;color:#fff}
.step{display:flex;gap:14px;align-items:flex-start}
.num{flex:none;width:48px;height:48px;border-radius:24px;color:#fff;font-weight:900;font-size:26px;display:grid;place-items:center}
.arrow{text-align:center;font-size:30px;color:#9a7340;line-height:1}
.foot{margin-top:18px;font-size:24px;color:#6b7785;line-height:1.5}
.two{grid-template-columns:1fr 1fr}
.three{grid-template-columns:1fr 1fr 1fr}
svg{direction:ltr}
svg text{font-family:Vazirmatn,sans-serif}
</style></head>
<body><div class="wrap" id="d"><div class="hd"><div class="badge">۱۱</div><div><h1>خواندن کد سوزن</h1>
<div class="sub">گیج، تعداد و چیدمان در یک کد</div></div></div><div style="margin-top:20px"><svg viewBox="0 0 660 450" width="660" xmlns="http://www.w3.org/2000/svg"><text x="330" y="90" font-size="96" fill="#1c3d52" font-weight="900" text-anchor="middle" direction="rtl">1207RL</text><path d="M177 112 Q 222 140 267 112" fill="none" stroke="#3a7bd5" stroke-width="6"/><path d="M222 132 L110 165" stroke="#3a7bd5" stroke-width="4"/><rect x="8" y="165" width="204" height="90" rx="16" fill="#3a7bd51f" stroke="#3a7bd5" stroke-width="3"/><text x="110" y="220" font-size="22" fill="#1c3d52" font-weight="800" text-anchor="middle" direction="rtl">۱۲ = گیج (قطر سیم)</text><path d="M285 112 Q 330 140 375 112" fill="none" stroke="#9a7340" stroke-width="6"/><path d="M330 132 L330 165" stroke="#9a7340" stroke-width="4"/><rect x="228" y="165" width="204" height="90" rx="16" fill="#9a73401f" stroke="#9a7340" stroke-width="3"/><text x="330" y="220" font-size="24" fill="#1c3d52" font-weight="800" text-anchor="middle" direction="rtl">۰۷ = تعداد سیم</text><path d="M395 112 Q 440 140 485 112" fill="none" stroke="#e84393" stroke-width="6"/><path d="M440 132 L550 165" stroke="#e84393" stroke-width="4"/><rect x="448" y="165" width="204" height="90" rx="16" fill="#e843931f" stroke="#e84393" stroke-width="3"/><text x="550" y="220" font-size="24" fill="#1c3d52" font-weight="800" text-anchor="middle" direction="rtl">RL = لاینر گرد</text><text x="330" y="300" font-size="28" fill="#1c3d52" font-weight="900" text-anchor="middle" direction="rtl">جدول گیج (تقریبی)</text><rect x="15" y="320" width="190" height="110" rx="18" fill="#f4efe6" stroke="#d8cfbf" stroke-width="3"/><text x="110" y="362" font-size="28" fill="#1c3d52" font-weight="900" text-anchor="middle" direction="rtl">گیج ۰۸</text><text x="110" y="405" font-size="24" fill="#6b7785" font-weight="600" text-anchor="middle" direction="rtl">≈ ۰٫۲۵ میلی‌متر</text><rect x="235" y="320" width="190" height="110" rx="18" fill="#f4efe6" stroke="#d8cfbf" stroke-width="3"/><text x="330" y="362" font-size="28" fill="#1c3d52" font-weight="900" text-anchor="middle" direction="rtl">گیج ۱۰</text><text x="330" y="405" font-size="24" fill="#6b7785" font-weight="600" text-anchor="middle" direction="rtl">≈ ۰٫۳۰ میلی‌متر</text><rect x="455" y="320" width="190" height="110" rx="18" fill="#f4efe6" stroke="#d8cfbf" stroke-width="3"/><text x="550" y="362" font-size="28" fill="#1c3d52" font-weight="900" text-anchor="middle" direction="rtl">گیج ۱۲</text><text x="550" y="405" font-size="24" fill="#6b7785" font-weight="600" text-anchor="middle" direction="rtl">≈ ۰٫۳۵ میلی‌متر</text></svg></div><p class="foot">اندازه‌ها تقریبی‌اند و بین سازنده‌ها کمی فرق دارند؛ برچسب جعبه مرجع است.</p></div></body></html>
