<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:720px;font-family:Vazirmatn,sans-serif;direction:rtl;background:#fff;color:#1c3d52}
.wrap{padding:32px 30px 28px}
.hd{display:flex;align-items:center;gap:16px}
.badge{flex:none;width:64px;height:64px;border-radius:32px;background:#e84393;color:#fff;font-weight:900;font-size:32px;display:grid;place-items:center}
h1{font-size:42px;font-weight:900;line-height:1.3}
.sub{font-size:29px;color:#6b7785;margin-top:6px;line-height:1.5}
.grid{display:grid;gap:14px;margin-top:22px}
.card{border-radius:22px;padding:16px 20px;border:3px solid #e6e1d8;background:#fff}
.card h3{font-size:33px;font-weight:900;line-height:1.35}
.card p,.card li{font-size:29px;line-height:1.6}
.card ul{padding-right:26px;margin-top:6px}
.tag{display:inline-block;border-radius:999px;padding:2px 16px;font-size:29px;font-weight:800;color:#fff}
.step{display:flex;gap:14px;align-items:flex-start}
.num{flex:none;width:54px;height:54px;border-radius:27px;color:#fff;font-weight:900;font-size:30px;display:grid;place-items:center}
.arrow{text-align:center;font-size:30px;color:#9a7340;line-height:1}
.foot{margin-top:18px;font-size:28px;color:#6b7785;line-height:1.5}
.two{grid-template-columns:1fr 1fr}
.three{grid-template-columns:1fr 1fr 1fr}
.two .card li{font-size:28px}
svg{direction:ltr}
svg text{font-family:Vazirmatn,sans-serif}
</style></head>
<body><div class="wrap" id="d"><div class="hd"><div class="badge">۳۳</div><div><h1>طراحی کاور</h1>
<div class="sub">خط‌های قدیمی باید در بخش تیرهٔ طرح تازه بیفتند</div></div></div><div style="margin-top:20px"><svg viewBox="0 0 660 320" width="660" overflow="visible" xmlns="http://www.w3.org/2000/svg"><rect x="450" y="20" width="200" height="230" rx="20" fill="#f6d2b8"/><g transform="translate(550,130)"><path d="M-40 -10 q40 -50 80 0 q-40 50 -80 0z" fill="none" stroke="#9aa4ae" stroke-width="10"/></g><text x="550" y="300" font-size="30" fill="#1c3d52" font-weight="900" text-anchor="middle" direction="rtl">کار قدیمی</text><rect x="230" y="20" width="200" height="230" rx="20" fill="#f6d2b8"/><g transform="translate(330,130)"><circle r="85" fill="#1b2a44"/><circle r="85" fill="none" stroke="#1b1b1b" stroke-width="8"/><path d="M-85 0 Q0 -140 85 0" fill="#e0a800" opacity=".9"/><path d="M-40 -10 q40 -50 80 0 q-40 50 -80 0z" fill="none" stroke="#d64545" stroke-width="10"/></g><text x="330" y="300" font-size="30" fill="#1c3d52" font-weight="900" text-anchor="middle" direction="rtl">طرح تازه روی آن</text><rect x="10" y="20" width="200" height="230" rx="20" fill="#f6d2b8"/><g transform="translate(110,130)"><circle r="85" fill="#1b2a44"/><circle r="85" fill="none" stroke="#1b1b1b" stroke-width="8"/><path d="M-85 0 Q0 -140 85 0" fill="#e0a800" opacity=".9"/></g><text x="110" y="300" font-size="30" fill="#1c3d52" font-weight="900" text-anchor="middle" direction="rtl">نتیجه</text></svg></div><p class="foot">کاور معمولاً بزرگ‌تر و تیره‌تر از کار قدیمی است؛ رنگ روشن، تیره را نمی‌پوشاند.</p></div></body></html>
