<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:720px;font-family:Vazirmatn,sans-serif;direction:rtl;background:#fff;color:#1c3d52}
.wrap{padding:32px 30px 28px}
.hd{display:flex;align-items:center;gap:16px}
.badge{flex:none;width:64px;height:64px;border-radius:32px;background:#e84393;color:#fff;font-weight:900;font-size:32px;display:grid;place-items:center}
h1{font-size:42px;font-weight:900;line-height:1.3}
.sub{font-size:29px;color:#6b7785;margin-top:6px;line-height:1.5}
.grid{display:grid;gap:14px;margin-top:22px}
.card{border-radius:22px;padding:16px 20px;border:3px solid #e6e1d8;background:#fff}
.card h3{font-size:33px;font-weight:900;line-height:1.35}
.card p,.card li{font-size:29px;line-height:1.6}
.card ul{padding-right:26px;margin-top:6px}
.tag{display:inline-block;border-radius:999px;padding:2px 16px;font-size:29px;font-weight:800;color:#fff}
.step{display:flex;gap:14px;align-items:flex-start}
.num{flex:none;width:54px;height:54px;border-radius:27px;color:#fff;font-weight:900;font-size:30px;display:grid;place-items:center}
.arrow{text-align:center;font-size:30px;color:#9a7340;line-height:1}
.foot{margin-top:18px;font-size:28px;color:#6b7785;line-height:1.5}
.two{grid-template-columns:1fr 1fr}
.three{grid-template-columns:1fr 1fr 1fr}
.two .card li{font-size:28px}
svg{direction:ltr}
svg text{font-family:Vazirmatn,sans-serif}
</style></head>
<body><div class="wrap" id="d"><div class="hd"><div class="badge">۳۴</div><div><h1>نقشهٔ آستین</h1>
<div class="sub">عنصرهای اصلی، پس‌زمینه و ترتیب جلسه‌ها</div></div></div><div style="margin-top:20px"><svg viewBox="0 0 660 520" width="660" overflow="visible" xmlns="http://www.w3.org/2000/svg"><path d="M525 40 h90 l-15 420 h-60z" fill="#f4efe6" stroke="#bfb3a0" stroke-width="4"/><text x="570" y="500" font-size="28" fill="#1c3d52" font-weight="800" text-anchor="middle" direction="rtl">بیرون</text><path d="M530 300 q20 -20 40 0 t40 0" stroke="#3a7bd5" stroke-width="4" fill="none"/><path d="M535 380 q20 -20 40 0 t35 0" stroke="#3a7bd5" stroke-width="4" fill="none"/><path d="M365 40 h90 l-15 420 h-60z" fill="#f4efe6" stroke="#bfb3a0" stroke-width="4"/><text x="410" y="500" font-size="28" fill="#1c3d52" font-weight="800" text-anchor="middle" direction="rtl">جلو</text><path d="M370 300 q20 -20 40 0 t40 0" stroke="#3a7bd5" stroke-width="4" fill="none"/><path d="M375 380 q20 -20 40 0 t35 0" stroke="#3a7bd5" stroke-width="4" fill="none"/><path d="M205 40 h90 l-15 420 h-60z" fill="#f4efe6" stroke="#bfb3a0" stroke-width="4"/><text x="250" y="500" font-size="28" fill="#1c3d52" font-weight="800" text-anchor="middle" direction="rtl">درون</text><path d="M210 300 q20 -20 40 0 t40 0" stroke="#3a7bd5" stroke-width="4" fill="none"/><path d="M215 380 q20 -20 40 0 t35 0" stroke="#3a7bd5" stroke-width="4" fill="none"/><path d="M45 40 h90 l-15 420 h-60z" fill="#f4efe6" stroke="#bfb3a0" stroke-width="4"/><text x="90" y="500" font-size="28" fill="#1c3d52" font-weight="800" text-anchor="middle" direction="rtl">پشت</text><path d="M50 300 q20 -20 40 0 t40 0" stroke="#3a7bd5" stroke-width="4" fill="none"/><path d="M55 380 q20 -20 40 0 t35 0" stroke="#3a7bd5" stroke-width="4" fill="none"/><circle cx="570" cy="140" r="36" fill="#e84393"/><text x="570" y="150" font-size="34" fill="#fff" font-weight="900" text-anchor="middle" direction="rtl">۱</text><circle cx="410" cy="230" r="36" fill="#9a7340"/><text x="410" y="240" font-size="34" fill="#fff" font-weight="900" text-anchor="middle" direction="rtl">۲</text><circle cx="250" cy="160" r="36" fill="#2e9e5b"/><text x="250" y="170" font-size="34" fill="#fff" font-weight="900" text-anchor="middle" direction="rtl">۳</text></svg></div><p class="foot">دایره‌های شماره‌دار: عنصر اصلی و ترتیب جلسه. موج آبی: پس‌زمینه. بین جلسه‌های یک ناحیه، ترمیم کامل.</p></div></body></html>
