<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:720px;font-family:Vazirmatn,sans-serif;direction:rtl;background:#fff;color:#1c3d52}
.wrap{padding:32px 30px 28px}
.hd{display:flex;align-items:center;gap:16px}
.badge{flex:none;width:58px;height:58px;border-radius:29px;background:#e84393;color:#fff;font-weight:900;font-size:28px;display:grid;place-items:center}
h1{font-size:36px;font-weight:900;line-height:1.3}
.sub{font-size:24px;color:#6b7785;margin-top:6px;line-height:1.5}
.grid{display:grid;gap:14px;margin-top:22px}
.card{border-radius:22px;padding:16px 20px;border:3px solid #e6e1d8;background:#fff}
.card h3{font-size:28px;font-weight:900;line-height:1.35}
.card p,.card li{font-size:24px;line-height:1.6}
.card ul{padding-right:26px;margin-top:6px}
.tag{display:inline-block;border-radius:999px;padding:2px 16px;font-size:24px;font-weight:800;color:#fff}
.step{display:flex;gap:14px;align-items:flex-start}
.num{flex:none;width:48px;height:48px;border-radius:24px;color:#fff;font-weight:900;font-size:26px;display:grid;place-items:center}
.arrow{text-align:center;font-size:30px;color:#9a7340;line-height:1}
.foot{margin-top:18px;font-size:24px;color:#6b7785;line-height:1.5}
.two{grid-template-columns:1fr 1fr}
.three{grid-template-columns:1fr 1fr 1fr}
svg{direction:ltr}
svg text{font-family:Vazirmatn,sans-serif}
</style></head>
<body><div class="wrap" id="d"><div class="hd"><div class="badge">۲۷</div><div><h1>اشباع و ترتیب رنگ</h1>
<div class="sub">رنگ روشن روی تیره نمی‌نشیند و سوزن را آلوده نمی‌کند</div></div></div><div style="margin-top:20px"><svg viewBox="0 0 660 460" width="660" xmlns="http://www.w3.org/2000/svg"><rect x="360" y="20" width="250" height="160" rx="12" fill="#c62828"/><rect x="380" y="50" width="30" height="30" fill="#f6d2b8"/><rect x="435" y="110" width="30" height="30" fill="#f6d2b8"/><rect x="490" y="50" width="30" height="30" fill="#f6d2b8"/><rect x="545" y="110" width="30" height="30" fill="#f6d2b8"/><rect x="50" y="20" width="250" height="160" rx="12" fill="#c62828"/><text x="485" y="220" font-size="26" fill="#d64545" font-weight="900" text-anchor="middle">اشباع ناقص</text><text x="175" y="220" font-size="26" fill="#2e9e5b" font-weight="900" text-anchor="middle">اشباع درست</text><rect x="530" y="270" width="120" height="120" rx="60" fill="#1b1b1b" stroke="#999" stroke-width="3"/><text x="590" y="340" font-size="26" fill="#fff" font-weight="900" text-anchor="middle">تیره</text><text x="510" y="345" font-size="34" fill="#9a7340" font-weight="900" text-anchor="middle">←</text><rect x="370" y="270" width="120" height="120" rx="60" fill="#8e44ad" stroke="#999" stroke-width="3"/><text x="430" y="340" font-size="26" fill="#fff" font-weight="900" text-anchor="middle">میانه</text><text x="350" y="345" font-size="34" fill="#9a7340" font-weight="900" text-anchor="middle">←</text><rect x="210" y="270" width="120" height="120" rx="60" fill="#f4b400" stroke="#999" stroke-width="3"/><text x="270" y="340" font-size="26" fill="#1c3d52" font-weight="900" text-anchor="middle">روشن</text><text x="190" y="345" font-size="34" fill="#9a7340" font-weight="900" text-anchor="middle">←</text><rect x="50" y="270" width="120" height="120" rx="60" fill="#ffffff" stroke="#999" stroke-width="3"/><text x="110" y="340" font-size="26" fill="#1c3d52" font-weight="900" text-anchor="middle">سفید</text><text x="330" y="440" font-size="26" fill="#1c3d52" font-weight="900" text-anchor="middle">ترتیب: تیره اول، روشن بعد، سفید آخر</text></svg></div></div></body></html>
