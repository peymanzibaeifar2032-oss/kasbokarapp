<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:720px;font-family:Vazirmatn,sans-serif;direction:rtl;background:#fff;color:#1c3d52}
.wrap{padding:32px 30px 28px}
.hd{display:flex;align-items:center;gap:16px}
.badge{flex:none;width:58px;height:58px;border-radius:29px;background:#e84393;color:#fff;font-weight:900;font-size:28px;display:grid;place-items:center}
h1{font-size:36px;font-weight:900;line-height:1.3}
.sub{font-size:24px;color:#6b7785;margin-top:6px;line-height:1.5}
.grid{display:grid;gap:14px;margin-top:22px}
.card{border-radius:22px;padding:16px 20px;border:3px solid #e6e1d8;background:#fff}
.card h3{font-size:28px;font-weight:900;line-height:1.35}
.card p,.card li{font-size:24px;line-height:1.6}
.card ul{padding-right:26px;margin-top:6px}
.tag{display:inline-block;border-radius:999px;padding:2px 16px;font-size:24px;font-weight:800;color:#fff}
.step{display:flex;gap:14px;align-items:flex-start}
.num{flex:none;width:48px;height:48px;border-radius:24px;color:#fff;font-weight:900;font-size:26px;display:grid;place-items:center}
.arrow{text-align:center;font-size:30px;color:#9a7340;line-height:1}
.foot{margin-top:18px;font-size:24px;color:#6b7785;line-height:1.5}
.two{grid-template-columns:1fr 1fr}
.three{grid-template-columns:1fr 1fr 1fr}
svg{direction:ltr}
svg text{font-family:Vazirmatn,sans-serif}
</style></head>
<body><div class="wrap" id="d"><div class="hd"><div class="badge">۸</div><div><h1>نقشهٔ ایستگاه کار</h1>
<div class="sub">هیچ وسیله‌ای از منطقهٔ آلوده به منطقهٔ تمیز برنمی‌گردد</div></div></div><div style="margin-top:20px"><svg viewBox="0 0 660 550" width="660" xmlns="http://www.w3.org/2000/svg"><rect x="10" y="10" width="300" height="440" rx="24" fill="#2e9e5b1a" stroke="#2e9e5b" stroke-width="4"/><text x="160" y="52" font-size="30" fill="#2e9e5b" font-weight="900" text-anchor="middle">منطقهٔ تمیز</text><rect x="40" y="90" width="240" height="84" rx="16" fill="#fff" stroke="#2e9e5b88" stroke-width="3"/><text x="160" y="142" font-size="24" fill="#1c3d52" font-weight="700" text-anchor="middle">بستهٔ استریل بسته</text><rect x="40" y="200" width="240" height="84" rx="16" fill="#fff" stroke="#2e9e5b88" stroke-width="3"/><text x="160" y="252" font-size="24" fill="#1c3d52" font-weight="700" text-anchor="middle">کاپ رنگ و وازلین</text><rect x="40" y="310" width="240" height="84" rx="16" fill="#fff" stroke="#2e9e5b88" stroke-width="3"/><text x="160" y="362" font-size="24" fill="#1c3d52" font-weight="700" text-anchor="middle">دستمال و پوشش تازه</text><rect x="350" y="10" width="300" height="440" rx="24" fill="#d6454514" stroke="#d64545" stroke-width="4"/><text x="500" y="52" font-size="30" fill="#d64545" font-weight="900" text-anchor="middle">منطقهٔ آلوده</text><rect x="380" y="90" width="240" height="84" rx="16" fill="#fff" stroke="#d6454588" stroke-width="3"/><text x="500" y="142" font-size="24" fill="#1c3d52" font-weight="700" text-anchor="middle">دستگاه با پوشش</text><rect x="380" y="200" width="240" height="84" rx="16" fill="#fff" stroke="#d6454588" stroke-width="3"/><text x="500" y="252" font-size="24" fill="#1c3d52" font-weight="700" text-anchor="middle">ظرف تیز</text><rect x="380" y="310" width="240" height="84" rx="16" fill="#fff" stroke="#d6454588" stroke-width="3"/><text x="500" y="362" font-size="24" fill="#1c3d52" font-weight="700" text-anchor="middle">سطل پسماند آلوده</text><path d="M150 480 H510" stroke="#9a7340" stroke-width="8" marker-end="url(#a)"/><defs><marker id="a" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6z" fill="#9a7340"/></marker></defs><text x="330" y="530" font-size="28" fill="#9a7340" font-weight="900" text-anchor="middle">مسیر یک‌طرفه: از تمیز به آلوده</text></svg></div><p class="foot">نمای بالا، نمادین. چیدمان دقیق به اندازهٔ میز و دست کاری هنرمند بستگی دارد.</p></div></body></html>
