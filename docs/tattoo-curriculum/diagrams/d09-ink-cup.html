<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:720px;font-family:Vazirmatn,sans-serif;direction:rtl;background:#fff;color:#1c3d52}
.wrap{padding:32px 30px 28px}
.hd{display:flex;align-items:center;gap:16px}
.badge{flex:none;width:64px;height:64px;border-radius:32px;background:#e84393;color:#fff;font-weight:900;font-size:32px;display:grid;place-items:center}
h1{font-size:42px;font-weight:900;line-height:1.3}
.sub{font-size:29px;color:#6b7785;margin-top:6px;line-height:1.5}
.grid{display:grid;gap:14px;margin-top:22px}
.card{border-radius:22px;padding:16px 20px;border:3px solid #e6e1d8;background:#fff}
.card h3{font-size:33px;font-weight:900;line-height:1.35}
.card p,.card li{font-size:29px;line-height:1.6}
.card ul{padding-right:26px;margin-top:6px}
.tag{display:inline-block;border-radius:999px;padding:2px 16px;font-size:29px;font-weight:800;color:#fff}
.step{display:flex;gap:14px;align-items:flex-start}
.num{flex:none;width:54px;height:54px;border-radius:27px;color:#fff;font-weight:900;font-size:30px;display:grid;place-items:center}
.arrow{text-align:center;font-size:30px;color:#9a7340;line-height:1}
.foot{margin-top:18px;font-size:28px;color:#6b7785;line-height:1.5}
.two{grid-template-columns:1fr 1fr}
.three{grid-template-columns:1fr 1fr 1fr}
.two .card li{font-size:28px}
svg{direction:ltr}
svg text{font-family:Vazirmatn,sans-serif}
</style></head>
<body><div class="wrap" id="d"><div class="hd"><div class="badge">۸</div><div><h1>مسیر یک‌طرفهٔ رنگ</h1>
<div class="sub">رنگ هرگز از کاپ به بطری برنمی‌گردد</div></div></div><div style="margin-top:20px"><svg viewBox="0 0 660 470" width="660" overflow="visible" xmlns="http://www.w3.org/2000/svg"><defs><marker id="a" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6z" fill="#2e9e5b"/></marker></defs><rect x="510" y="60" width="110" height="200" rx="20" fill="#1c3d52"/><rect x="540" y="30" width="50" height="40" rx="8" fill="#9a7340"/><text x="565" y="310" font-size="30" fill="#1c3d52" font-weight="700" text-anchor="middle" direction="rtl">بطری رنگ</text><path d="M290 150 h80 l-14 110 h-52z" fill="#3a7bd555" stroke="#3a7bd5" stroke-width="4"/><text x="330" y="310" font-size="30" fill="#1c3d52" font-weight="700" text-anchor="middle" direction="rtl">کاپ یک‌بارمصرف</text><rect x="40" y="170" width="150" height="26" rx="10" fill="#6b7785"/><path d="M40 183 l-30 0" stroke="#6b7785" stroke-width="6"/><text x="110" y="310" font-size="30" fill="#1c3d52" font-weight="700" text-anchor="middle" direction="rtl">سوزن</text><path d="M500 130 C 450 100, 420 110, 385 140" fill="none" stroke="#2e9e5b" stroke-width="7" marker-end="url(#a)"/><path d="M280 200 C 250 200, 230 190, 205 185" fill="none" stroke="#2e9e5b" stroke-width="7" marker-end="url(#a)"/><path d="M380 370 C 430 400, 470 400, 520 370" fill="none" stroke="#d64545" stroke-width="7" stroke-dasharray="14 10"/><g stroke="#d64545" stroke-width="10" stroke-linecap="round"><path d="M425 360 l40 40"/><path d="M465 360 l-40 40"/></g><text x="450" y="450" font-size="32" fill="#d64545" font-weight="900" text-anchor="middle" direction="rtl">برگشت به بطری ممنوع</text></svg></div><p class="foot">تهٔ کاپ پس از هر مشتری دور ریخته می‌شود؛ نوک بطری به کاپ یا دستکش آلوده نمی‌خورد.</p></div></body></html>
