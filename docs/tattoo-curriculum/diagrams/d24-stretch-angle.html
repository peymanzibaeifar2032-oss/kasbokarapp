<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:720px;font-family:Vazirmatn,sans-serif;direction:rtl;background:#fff;color:#1c3d52}
.wrap{padding:32px 30px 28px}
.hd{display:flex;align-items:center;gap:16px}
.badge{flex:none;width:58px;height:58px;border-radius:29px;background:#e84393;color:#fff;font-weight:900;font-size:28px;display:grid;place-items:center}
h1{font-size:36px;font-weight:900;line-height:1.3}
.sub{font-size:24px;color:#6b7785;margin-top:6px;line-height:1.5}
.grid{display:grid;gap:14px;margin-top:22px}
.card{border-radius:22px;padding:16px 20px;border:3px solid #e6e1d8;background:#fff}
.card h3{font-size:28px;font-weight:900;line-height:1.35}
.card p,.card li{font-size:24px;line-height:1.6}
.card ul{padding-right:26px;margin-top:6px}
.tag{display:inline-block;border-radius:999px;padding:2px 16px;font-size:24px;font-weight:800;color:#fff}
.step{display:flex;gap:14px;align-items:flex-start}
.num{flex:none;width:48px;height:48px;border-radius:24px;color:#fff;font-weight:900;font-size:26px;display:grid;place-items:center}
.arrow{text-align:center;font-size:30px;color:#9a7340;line-height:1}
.foot{margin-top:18px;font-size:24px;color:#6b7785;line-height:1.5}
.two{grid-template-columns:1fr 1fr}
.three{grid-template-columns:1fr 1fr 1fr}
svg{direction:ltr}
svg text{font-family:Vazirmatn,sans-serif}
</style></head>
<body><div class="wrap" id="d"><div class="hd"><div class="badge">۲۳</div><div><h1>کشش پوست و زاویهٔ سوزن</h1>
<div class="sub">کشش یکنواخت و زاویهٔ ثابت</div></div></div><div style="margin-top:20px"><svg viewBox="0 0 660 540" width="660" xmlns="http://www.w3.org/2000/svg"><defs><marker id="a" markerWidth="5" markerHeight="5" refX="2.5" refY="2.5" orient="auto"><path d="M0 0 L5 2.5 L0 5z" fill="#e84393"/></marker></defs><rect x="10" y="10" width="640" height="230" rx="22" fill="#f6d2b8"/><circle cx="200" cy="125" r="38" fill="#e9b996" stroke="#b07a52" stroke-width="4"/><circle cx="460" cy="125" r="38" fill="#e9b996" stroke="#b07a52" stroke-width="4"/><path d="M160 125 H60" stroke="#e84393" stroke-width="8" marker-end="url(#a)"/><path d="M500 125 H600" stroke="#e84393" stroke-width="8" marker-end="url(#a)"/><path d="M260 125 H400" stroke="#1b1b1b" stroke-width="6"/><text x="330" y="215" font-size="24" fill="#1c3d52" font-weight="800" text-anchor="middle">کشش یکنواخت با دو انگشت در دو جهت</text><path d="M360 470 H620" stroke="#b07a52" stroke-width="6"/><path d="M490 470 L548.1434243653637 310.2522544663956" stroke="#1c3d52" stroke-width="16" stroke-linecap="round"/><text x="490" y="520" font-size="24" fill="#1c3d52" font-weight="800" text-anchor="middle">خط: حدود ۴۵ تا ۹۰ درجه</text><path d="M40 470 H300" stroke="#b07a52" stroke-width="6"/><path d="M170 470 L300.22755533022627 360.72610635328834" stroke="#1c3d52" stroke-width="16" stroke-linecap="round"/><text x="170" y="520" font-size="24" fill="#1c3d52" font-weight="800" text-anchor="middle">سایه: زاویهٔ خوابیده‌تر</text></svg></div><p class="foot">زاویه‌ها تقریبی‌اند و با دستگاه، سوزن و سبک فرق می‌کنند؛ زیر نظر استاد تنظیم شود.</p></div></body></html>
