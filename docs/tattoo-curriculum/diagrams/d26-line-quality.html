<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:720px;font-family:Vazirmatn,sans-serif;direction:rtl;background:#fff;color:#1c3d52}
.wrap{padding:32px 30px 28px}
.hd{display:flex;align-items:center;gap:16px}
.badge{flex:none;width:58px;height:58px;border-radius:29px;background:#e84393;color:#fff;font-weight:900;font-size:28px;display:grid;place-items:center}
h1{font-size:36px;font-weight:900;line-height:1.3}
.sub{font-size:24px;color:#6b7785;margin-top:6px;line-height:1.5}
.grid{display:grid;gap:14px;margin-top:22px}
.card{border-radius:22px;padding:16px 20px;border:3px solid #e6e1d8;background:#fff}
.card h3{font-size:28px;font-weight:900;line-height:1.35}
.card p,.card li{font-size:24px;line-height:1.6}
.card ul{padding-right:26px;margin-top:6px}
.tag{display:inline-block;border-radius:999px;padding:2px 16px;font-size:24px;font-weight:800;color:#fff}
.step{display:flex;gap:14px;align-items:flex-start}
.num{flex:none;width:48px;height:48px;border-radius:24px;color:#fff;font-weight:900;font-size:26px;display:grid;place-items:center}
.arrow{text-align:center;font-size:30px;color:#9a7340;line-height:1}
.foot{margin-top:18px;font-size:24px;color:#6b7785;line-height:1.5}
.two{grid-template-columns:1fr 1fr}
.three{grid-template-columns:1fr 1fr 1fr}
svg{direction:ltr}
svg text{font-family:Vazirmatn,sans-serif}
</style></head>
<body><div class="wrap" id="d"><div class="hd"><div class="badge">۲۵</div><div><h1>کیفیت خط</h1>
<div class="sub">خط یک‌عبوره و اتصال پنهان</div></div></div><div style="margin-top:20px"><svg viewBox="0 0 660 560" width="660" xmlns="http://www.w3.org/2000/svg"><g transform="translate(0,60)"><path d="M30 0 H400" stroke="#1b1b1b" stroke-width="9" stroke-linecap="round"/></g><text x="640" y="70" font-size="26" fill="#2e9e5b" font-weight="900" text-anchor="end">پیوسته و یک‌عبوره</text><g transform="translate(0,170)"><path d="M30 0 q20 -10 40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0" stroke="#1b1b1b" stroke-width="9" fill="none"/></g><text x="640" y="180" font-size="26" fill="#d64545" font-weight="900" text-anchor="end">لرزان</text><g transform="translate(0,280)"><path d="M30 -5 H400" stroke="#1b1b1b" stroke-width="8"/><path d="M30 6 H400" stroke="#1b1b1b" stroke-width="8"/></g><text x="640" y="290" font-size="26" fill="#d64545" font-weight="900" text-anchor="end">دوخطی (عبور دوباره)</text><circle cx="230" cy="450" r="85" fill="none" stroke="#1b1b1b" stroke-width="9"/><circle cx="315" cy="450" r="16" fill="none" stroke="#2e9e5b" stroke-width="5"/><text x="640" y="440" font-size="26" fill="#1c3d52" font-weight="900" text-anchor="end">بستن دایره:</text><text x="640" y="480" font-size="24" fill="#6b7785" font-weight="700" text-anchor="end">اتصال در جای پنهان</text></svg></div></div></body></html>
