<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:720px;font-family:Vazirmatn,sans-serif;direction:rtl;background:#fff;color:#1c3d52}
.wrap{padding:32px 30px 28px}
.hd{display:flex;align-items:center;gap:16px}
.badge{flex:none;width:64px;height:64px;border-radius:32px;background:#e84393;color:#fff;font-weight:900;font-size:32px;display:grid;place-items:center}
h1{font-size:42px;font-weight:900;line-height:1.3}
.sub{font-size:29px;color:#6b7785;margin-top:6px;line-height:1.5}
.grid{display:grid;gap:14px;margin-top:22px}
.card{border-radius:22px;padding:16px 20px;border:3px solid #e6e1d8;background:#fff}
.card h3{font-size:33px;font-weight:900;line-height:1.35}
.card p,.card li{font-size:29px;line-height:1.6}
.card ul{padding-right:26px;margin-top:6px}
.tag{display:inline-block;border-radius:999px;padding:2px 16px;font-size:29px;font-weight:800;color:#fff}
.step{display:flex;gap:14px;align-items:flex-start}
.num{flex:none;width:54px;height:54px;border-radius:27px;color:#fff;font-weight:900;font-size:30px;display:grid;place-items:center}
.arrow{text-align:center;font-size:30px;color:#9a7340;line-height:1}
.foot{margin-top:18px;font-size:28px;color:#6b7785;line-height:1.5}
.two{grid-template-columns:1fr 1fr}
.three{grid-template-columns:1fr 1fr 1fr}
.two .card li{font-size:28px}
svg{direction:ltr}
svg text{font-family:Vazirmatn,sans-serif}
</style></head>
<body><div class="wrap" id="d"><div class="hd"><div class="badge">۳۹</div><div><h1>تاتو در گذر سال‌ها</h1>
<div class="sub">نمایش نمادین و تقریبی</div></div></div><div style="margin-top:20px"><svg viewBox="0 0 660 320" width="660" overflow="visible" xmlns="http://www.w3.org/2000/svg"><defs><filter id="b0"><feGaussianBlur stdDeviation="0"/></filter></defs><rect x="450" y="20" width="200" height="230" rx="20" fill="#f6d2b8"/><g filter="url(#b0)" transform="translate(550,135)"><path d="M0 -70 C40 -20 40 30 0 70 C-40 30 -40 -20 0 -70z" fill="#555" stroke="#1b1b1b" stroke-width="6"/><path d="M0 -40 V40" stroke="#1b1b1b" stroke-width="4"/></g><text x="550" y="300" font-size="30" fill="#1c3d52" font-weight="900" text-anchor="middle" direction="rtl">تازه</text><defs><filter id="b1"><feGaussianBlur stdDeviation="1.2"/></filter></defs><rect x="230" y="20" width="200" height="230" rx="20" fill="#f6d2b8"/><g filter="url(#b1)" transform="translate(330,135)"><path d="M0 -70 C40 -20 40 30 0 70 C-40 30 -40 -20 0 -70z" fill="#666" stroke="#1b1b1b" stroke-width="9"/><path d="M0 -40 V40" stroke="#1b1b1b" stroke-width="7"/></g><text x="330" y="300" font-size="30" fill="#1c3d52" font-weight="900" text-anchor="middle" direction="rtl">چند سال بعد</text><defs><filter id="b2"><feGaussianBlur stdDeviation="2.5"/></filter></defs><rect x="10" y="20" width="200" height="230" rx="20" fill="#f6d2b8"/><g filter="url(#b2)" transform="translate(110,135)"><path d="M0 -70 C40 -20 40 30 0 70 C-40 30 -40 -20 0 -70z" fill="#777" stroke="#1b1b1b" stroke-width="13"/><path d="M0 -40 V40" stroke="#1b1b1b" stroke-width="11"/></g><text x="110" y="300" font-size="30" fill="#1c3d52" font-weight="900" text-anchor="middle" direction="rtl">سال‌ها بعد</text></svg></div><p class="foot">خط‌ها کمی پهن‌تر و ارزش‌ها نزدیک‌تر می‌شوند؛ آفتاب مهم‌ترین عامل محو شدن است.</p></div></body></html>
