<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:720px;font-family:Vazirmatn,sans-serif;direction:rtl;background:#fff;color:#1c3d52}
.wrap{padding:32px 30px 28px}
.hd{display:flex;align-items:center;gap:16px}
.badge{flex:none;width:58px;height:58px;border-radius:29px;background:#e84393;color:#fff;font-weight:900;font-size:28px;display:grid;place-items:center}
h1{font-size:36px;font-weight:900;line-height:1.3}
.sub{font-size:24px;color:#6b7785;margin-top:6px;line-height:1.5}
.grid{display:grid;gap:14px;margin-top:22px}
.card{border-radius:22px;padding:16px 20px;border:3px solid #e6e1d8;background:#fff}
.card h3{font-size:28px;font-weight:900;line-height:1.35}
.card p,.card li{font-size:24px;line-height:1.6}
.card ul{padding-right:26px;margin-top:6px}
.tag{display:inline-block;border-radius:999px;padding:2px 16px;font-size:24px;font-weight:800;color:#fff}
.step{display:flex;gap:14px;align-items:flex-start}
.num{flex:none;width:48px;height:48px;border-radius:24px;color:#fff;font-weight:900;font-size:26px;display:grid;place-items:center}
.arrow{text-align:center;font-size:30px;color:#9a7340;line-height:1}
.foot{margin-top:18px;font-size:24px;color:#6b7785;line-height:1.5}
.two{grid-template-columns:1fr 1fr}
.three{grid-template-columns:1fr 1fr 1fr}
svg{direction:ltr}
svg text{font-family:Vazirmatn,sans-serif}
</style></head>
<body><div class="wrap" id="d"><div class="hd"><div class="badge">۳۷</div><div><h1>چیدمان عکس نمونه‌کار</h1>
<div class="sub">نمای بالا: نور یکنواخت از دو طرف، دوربین عمود</div></div></div><div style="margin-top:20px"><svg viewBox="0 0 660 510" width="660" xmlns="http://www.w3.org/2000/svg"><rect x="230" y="190" width="200" height="140" rx="16" fill="#f6d2b8" stroke="#b07a52" stroke-width="4"/><text x="330" y="270" font-size="26" fill="#1c3d52" font-weight="900" text-anchor="middle">تاتو</text><rect x="290" y="30" width="80" height="60" rx="10" fill="#1c3d52"/><circle cx="330" cy="60" r="18" fill="#fff"/><text x="330" y="125" font-size="24" fill="#1c3d52" font-weight="800" text-anchor="middle">دوربین عمود</text><path d="M330 95 V185" stroke="#1c3d52" stroke-width="4" stroke-dasharray="8 6"/><g transform="translate(560,420) rotate(-45)"><rect x="-60" y="-30" width="120" height="60" rx="12" fill="#e0a800"/></g><g transform="translate(100,420) rotate(45)"><rect x="-60" y="-30" width="120" height="60" rx="12" fill="#e0a800"/></g><path d="M520 390 L430 330" stroke="#e0a800" stroke-width="6"/><path d="M140 390 L230 330" stroke="#e0a800" stroke-width="6"/><text x="560" y="490" font-size="24" fill="#9a7340" font-weight="800" text-anchor="middle">نور نرم ۴۵°</text><text x="100" y="490" font-size="24" fill="#9a7340" font-weight="800" text-anchor="middle">نور نرم ۴۵°</text></svg></div><p class="foot">بدون فلاش مستقیم و بدون فیلتر؛ زمینهٔ ساده.</p></div></body></html>
