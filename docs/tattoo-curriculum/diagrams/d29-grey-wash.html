<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:720px;font-family:Vazirmatn,sans-serif;direction:rtl;background:#fff;color:#1c3d52}
.wrap{padding:32px 30px 28px}
.hd{display:flex;align-items:center;gap:16px}
.badge{flex:none;width:58px;height:58px;border-radius:29px;background:#e84393;color:#fff;font-weight:900;font-size:28px;display:grid;place-items:center}
h1{font-size:36px;font-weight:900;line-height:1.3}
.sub{font-size:24px;color:#6b7785;margin-top:6px;line-height:1.5}
.grid{display:grid;gap:14px;margin-top:22px}
.card{border-radius:22px;padding:16px 20px;border:3px solid #e6e1d8;background:#fff}
.card h3{font-size:28px;font-weight:900;line-height:1.35}
.card p,.card li{font-size:24px;line-height:1.6}
.card ul{padding-right:26px;margin-top:6px}
.tag{display:inline-block;border-radius:999px;padding:2px 16px;font-size:24px;font-weight:800;color:#fff}
.step{display:flex;gap:14px;align-items:flex-start}
.num{flex:none;width:48px;height:48px;border-radius:24px;color:#fff;font-weight:900;font-size:26px;display:grid;place-items:center}
.arrow{text-align:center;font-size:30px;color:#9a7340;line-height:1}
.foot{margin-top:18px;font-size:24px;color:#6b7785;line-height:1.5}
.two{grid-template-columns:1fr 1fr}
.three{grid-template-columns:1fr 1fr 1fr}
svg{direction:ltr}
svg text{font-family:Vazirmatn,sans-serif}
</style></head>
<body><div class="wrap" id="d"><div class="hd"><div class="badge">۲۸</div><div><h1>سری کاپ‌های خاکستری</h1>
<div class="sub">از روشن شروع کن، تیره را به‌تدریج بساز</div></div></div><div style="margin-top:20px"><svg viewBox="0 0 660 380" width="660" xmlns="http://www.w3.org/2000/svg"><path d="M515 40 h90 l-14 110 h-62z" fill="#e6e6e6" stroke="#777" stroke-width="3"/><rect x="505" y="190" width="110" height="70" rx="10" fill="#e6e6e6" stroke="#999" stroke-width="2"/><text x="560" y="300" font-size="26" fill="#1c3d52" font-weight="900" text-anchor="middle" direction="rtl">۱</text><path d="M390 40 h90 l-14 110 h-62z" fill="#bdbdbd" stroke="#777" stroke-width="3"/><rect x="380" y="190" width="110" height="70" rx="10" fill="#bdbdbd" stroke="#999" stroke-width="2"/><text x="435" y="300" font-size="26" fill="#1c3d52" font-weight="900" text-anchor="middle" direction="rtl">۲</text><path d="M265 40 h90 l-14 110 h-62z" fill="#8a8a8a" stroke="#777" stroke-width="3"/><rect x="255" y="190" width="110" height="70" rx="10" fill="#8a8a8a" stroke="#999" stroke-width="2"/><text x="310" y="300" font-size="26" fill="#1c3d52" font-weight="900" text-anchor="middle" direction="rtl">۳</text><path d="M140 40 h90 l-14 110 h-62z" fill="#4d4d4d" stroke="#777" stroke-width="3"/><rect x="130" y="190" width="110" height="70" rx="10" fill="#4d4d4d" stroke="#999" stroke-width="2"/><text x="185" y="300" font-size="26" fill="#1c3d52" font-weight="900" text-anchor="middle" direction="rtl">۴</text><path d="M15 40 h90 l-14 110 h-62z" fill="#111" stroke="#777" stroke-width="3"/><rect x="5" y="190" width="110" height="70" rx="10" fill="#111" stroke="#999" stroke-width="2"/><text x="60" y="300" font-size="26" fill="#1c3d52" font-weight="900" text-anchor="middle" direction="rtl">۵</text><text x="330" y="360" font-size="24" fill="#6b7785" font-weight="700" text-anchor="middle" direction="rtl">نسبت‌ها نمونه‌اند؛ نسبت خودت را بنویس.</text></svg></div><p class="foot">رقیق‌کننده: محلول توصیه‌شدهٔ سازنده یا آب استریل. برخی سازندگان سری خاکستری آماده دارند.</p></div></body></html>
