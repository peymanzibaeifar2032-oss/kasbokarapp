<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:720px;font-family:Vazirmatn,sans-serif;direction:rtl;background:#fff;color:#1c3d52}
.wrap{padding:32px 30px 28px}
.hd{display:flex;align-items:center;gap:16px}
.badge{flex:none;width:64px;height:64px;border-radius:32px;background:#e84393;color:#fff;font-weight:900;font-size:32px;display:grid;place-items:center}
h1{font-size:42px;font-weight:900;line-height:1.3}
.sub{font-size:29px;color:#6b7785;margin-top:6px;line-height:1.5}
.grid{display:grid;gap:14px;margin-top:22px}
.card{border-radius:22px;padding:16px 20px;border:3px solid #e6e1d8;background:#fff}
.card h3{font-size:33px;font-weight:900;line-height:1.35}
.card p,.card li{font-size:29px;line-height:1.6}
.card ul{padding-right:26px;margin-top:6px}
.tag{display:inline-block;border-radius:999px;padding:2px 16px;font-size:29px;font-weight:800;color:#fff}
.step{display:flex;gap:14px;align-items:flex-start}
.num{flex:none;width:54px;height:54px;border-radius:27px;color:#fff;font-weight:900;font-size:30px;display:grid;place-items:center}
.arrow{text-align:center;font-size:30px;color:#9a7340;line-height:1}
.foot{margin-top:18px;font-size:28px;color:#6b7785;line-height:1.5}
.two{grid-template-columns:1fr 1fr}
.three{grid-template-columns:1fr 1fr 1fr}
.two .card li{font-size:28px}
svg{direction:ltr}
svg text{font-family:Vazirmatn,sans-serif}
</style></head>
<body><div class="wrap" id="d"><div class="hd"><div class="badge">۱۳</div><div><h1>برچسب رنگ را بخوان</h1>
<div class="sub">این پنج مورد پیش از خرید و مصرف</div></div></div><div style="margin-top:20px"><svg viewBox="0 0 660 560" width="660" overflow="visible" xmlns="http://www.w3.org/2000/svg"><rect x="150" y="20" width="360" height="520" rx="40" fill="#1c3d52"/><rect x="250" y="0" width="160" height="40" rx="10" fill="#9a7340"/><rect x="180" y="80" width="300" height="430" rx="16" fill="#fff"/><rect x="200" y="110" width="260" height="64" rx="12" fill="#2e9e5b1a" stroke="#2e9e5b" stroke-width="3"/><text x="330" y="152" font-size="28" fill="#1c3d52" font-weight="800" text-anchor="middle" direction="rtl">سازنده و نشانی</text><circle cx="530" cy="142" r="20" fill="#2e9e5b"/><text x="530" y="151" font-size="28" fill="#fff" font-weight="900" text-anchor="middle" direction="rtl">✓</text><rect x="200" y="192" width="260" height="64" rx="12" fill="#2e9e5b1a" stroke="#2e9e5b" stroke-width="3"/><text x="330" y="234" font-size="28" fill="#1c3d52" font-weight="800" text-anchor="middle" direction="rtl">شمارهٔ ساخت (لات)</text><circle cx="530" cy="224" r="20" fill="#2e9e5b"/><text x="530" y="233" font-size="28" fill="#fff" font-weight="900" text-anchor="middle" direction="rtl">✓</text><rect x="200" y="274" width="260" height="64" rx="12" fill="#2e9e5b1a" stroke="#2e9e5b" stroke-width="3"/><text x="330" y="316" font-size="28" fill="#1c3d52" font-weight="800" text-anchor="middle" direction="rtl">تاریخ انقضا</text><circle cx="530" cy="306" r="20" fill="#2e9e5b"/><text x="530" y="315" font-size="28" fill="#fff" font-weight="900" text-anchor="middle" direction="rtl">✓</text><rect x="200" y="356" width="260" height="64" rx="12" fill="#2e9e5b1a" stroke="#2e9e5b" stroke-width="3"/><text x="330" y="398" font-size="28" fill="#1c3d52" font-weight="800" text-anchor="middle" direction="rtl">فهرست ترکیبات</text><circle cx="530" cy="388" r="20" fill="#2e9e5b"/><text x="530" y="397" font-size="28" fill="#fff" font-weight="900" text-anchor="middle" direction="rtl">✓</text><rect x="200" y="438" width="260" height="64" rx="12" fill="#2e9e5b1a" stroke="#2e9e5b" stroke-width="3"/><text x="330" y="480" font-size="28" fill="#1c3d52" font-weight="800" text-anchor="middle" direction="rtl">هشدارها</text><circle cx="530" cy="470" r="20" fill="#2e9e5b"/><text x="530" y="479" font-size="28" fill="#fff" font-weight="900" text-anchor="middle" direction="rtl">✓</text></svg></div><p class="foot">رنگ بدون برچسب، شمارهٔ ساخت یا تاریخ انقضا خریده نمی‌شود. شمارهٔ ساخت را در پروندهٔ مشتری ثبت کن.</p></div></body></html>
